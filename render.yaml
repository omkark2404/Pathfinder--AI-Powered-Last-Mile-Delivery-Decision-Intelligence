# ============================================================
# Render Blueprint Specification — Pathfinder--AI-Powered-Last-Mile-Delivery-Decision-Intelligence
# 100% FREE TIER CONFIGURATION
# ============================================================

services:
  # ------------------------------------------------------------
  # FastAPI Backend Web Service (Free Tier)
  # ------------------------------------------------------------
  - type: web
    name: lastmile-backend
    env: python
    plan: free
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: PYTHONPATH
        value: "backend"
      - key: ENVIRONMENT
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATA_DIR
        value: "./data"

  # ------------------------------------------------------------
  # Next.js Frontend Web Service (Free Tier)
  # ------------------------------------------------------------
  - type: web
    name: lastmile-frontend
    env: node
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://lastmile-backend.onrender.com"
